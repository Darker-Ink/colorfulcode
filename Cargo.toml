[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Darker-Ink/colorfulcode"
rust-version = "1.80"

[workspace.dependencies]
colorfulcode = { path = "crates/colorfulcode", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
