[package]
name = "colorfulcode"
description = "Fast syntax highlighting for a lot of languages"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["syntax", "highlighting", "highlighter", "lexer", "wasm"]
categories = ["text-processing", "parsing"]
readme = "../../README.md"

[features]
default = ["all-languages"]
# Every language. Without it only the most used ones are included, which
# makes for a much smaller WebAssembly module.
all-languages = []

[dependencies]
