base: &defaults
  adapter: postgres
  host: localhost
development:
  <<: *defaults
  database: dev_db
tags: [web, "api", 42, {nested: true}]
env: {LOG_LEVEL: debug, PORT: 8080}
items:
  - name: first
    value: 10
  - name: second
    script: |
      echo "hello # not a comment"

      exit 0
    summary: >-
      Folded text that
      spans lines.
  - - nested
    - list
  - !!str 123
  - !custom
    key: value
? complex key
: complex value
description: plain scalar
