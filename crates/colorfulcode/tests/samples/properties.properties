# Application properties
! Old style comment
app.name=My Application
app.version = 2.1.0
server.port: 8080
greeting=Hello\tWorld\n
unicode=caf\u00e9
path=C:\\Program Files\\App
key\ with\ spaces = value
message = This is a long \
    message that continues \
    on several lines
db.url=jdbc:postgresql://localhost:5432/db?user=${DB_USER}
feature.enabled=true
empty.value=
whitespace separated value

# Logging
logging.level.root=WARN
logging.level.com.example=DEBUG
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n
spring.datasource.max-pool-size = 20
spring.jackson.serialization.indent_output=yes
retry.backoff.multiplier=1.5
colon\:in\:key=escaped colons
