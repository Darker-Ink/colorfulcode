; Global settings
# Hash comments too
[core]
editor = vim
autocrlf = false
port = 8080
ratio = 0.5
name = "quoted value" ; trailing comment

[remote "origin"]
url = https://github.com/user/repo.git
fetch = +refs/heads/*:refs/remotes/origin/*

[paths]
home = /home/${USER}/data
log_dir = %(home)s/logs
key: value with colon separator
skip-external-locking
long_value = first line
    continued line

[section.with.dots]
enabled=yes
empty =
