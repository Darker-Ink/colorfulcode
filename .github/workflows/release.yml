# Publishes the crates to crates.io and the package to npm when a GitHub
# release is published. The release tag must be the version with a `v` in
# front (v0.2.0), matching Cargo.toml and packages/colorfulcode/package.json.
#
# Authentication uses trusted publishing (GitHub OIDC, no stored secrets),
# configured on crates.io and npmjs.com for this file, release.yml, and the
# `release` environment. Neither registry lets a trusted publisher create a
# brand new package, so the very first release falls back to the
# CARGO_REGISTRY_TOKEN and NPM_TOKEN secrets when they exist. Delete them once
# trusted publishing is set up.
#
# Re-running is safe: anything already published at this version is skipped,
# so a release that failed halfway can simply be re-run.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        name: Tag matches the package versions
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          dep_version=$(sed -n 's/^colorfulcode = {.*version = "\([^"]*\)".*/\1/p' Cargo.toml)
          npm_version=$(node -p "require('./packages/colorfulcode/package.json').version")
          echo "tag $version, Cargo.toml $cargo_version (dependency $dep_version), package.json $npm_version"
          if [ "$version" != "$cargo_version" ] || [ "$version" != "$dep_version" ] || [ "$version" != "$npm_version" ]; then
            echo "::error::Release tag $TAG does not match every package version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  crates:
    needs: [version, ci]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing
    env:
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Get a short-lived crates.io token
        id: auth
        if: env.HAS_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Dependency order: the library first, then what depends on it.
          for crate in colorfulcode colorfulcode-cli colorfulcode-ffi; do
            if curl -sf -A "colorfulcode-release (github.com/${{ github.repository }})" \
                "https://crates.io/api/v1/crates/$crate/$VERSION" > /dev/null; then
              echo "$crate $VERSION is already on crates.io, skipping"
            else
              cargo publish -p "$crate"
            fi
          done

  npm:
    needs: [version, ci]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish to npm
        working-directory: packages/colorfulcode
        env:
          # npm tries trusted publishing first and only uses this token when
          # that fails, which is the case for the very first publish.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if npm view "colorfulcode@$VERSION" version > /dev/null 2>&1; then
            echo "colorfulcode@$VERSION is already on npm, skipping"
            exit 0
          fi
          # Pre-releases (0.2.0-beta.1) go to the `next` tag so `latest` stays stable.
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          npm publish --provenance --access public --tag "$tag"
